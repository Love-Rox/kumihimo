name: Publish VS Code extension

# The extension is private, so changesets neither versions nor releases it. The version in
# its manifest is therefore the whole statement of intent: when that changes on main, it is
# meant to go out. Anything else touching packages/vscode is not a release.
on:
  push:
    branches: [main]
    paths:
      - 'packages/vscode/**'
  workflow_dispatch:

concurrency:
  group: publish-vscode
  cancel-in-progress: false

permissions:
  # write, to attach the .vsix to a GitHub release. That release is where the extension is
  # actually obtainable while Marketplace publishing is unconfigured, so it is not optional.
  contents: write
  # The OIDC token `azure/login` exchanges for a short-lived Entra ID one. This is what
  # makes publishing possible with no stored secret at all.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=love-rox.kumihimo-vscode
    # Both tokens live here rather than on their steps: a step's own `env:` is not visible
    # to that step's `if:`, so the condition would always compare against an empty string.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Identifiers, not credentials — a variable rather than a secret, so a failed run is
      # readable. Set both to publish over OIDC; leave them unset to fall back to the PAT,
      # or to neither and get the .vsix on a GitHub release.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The previous commit, to see whether the version moved.
          fetch-depth: 2

      - id: version
        name: Decide whether this is a release
        run: |
          current=$(node -p "require('./packages/vscode/package.json').version")
          previous=$(git show HEAD~1:packages/vscode/package.json 2>/dev/null \
            | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo none)

          echo "current=$current"  >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "手動実行のため公開します ($current)"
          elif [ "$current" != "$previous" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "バージョンが $previous → $current に変わったため公開します"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "バージョンは $current のまま。公開しません"
          fi

      - uses: pnpm/action-setup@v5
        if: steps.version.outputs.publish == 'true'

      - uses: actions/setup-node@v6
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.version.outputs.publish == 'true'

      # The trailing `...` builds this package's workspace dependencies first. Without it
      # the bundler cannot resolve the compiler at all: a fresh checkout has no dist to
      # import, and a machine that has built once already hides that.
      #
      # `build` also writes THIRD-PARTY-NOTICES.txt, which the .vsix has to carry: the
      # bundle contains elkjs, and minification leaves no notice in it.
      - run: pnpm --filter "kumihimo-vscode..." build
        if: steps.version.outputs.publish == 'true'

      - run: pnpm --filter kumihimo-vscode exec vsce package --no-dependencies --out kumihimo.vsix
        if: steps.version.outputs.publish == 'true'

      # A GitHub release rather than a run artifact: artifacts expire after ninety days and
      # need a login to fetch, and while Marketplace publishing is unconfigured this is
      # where the extension is actually obtainable.
      #
      # Re-runnable. `gh release create` fails on an existing tag, so an existing release
      # has its asset replaced instead — a re-run should end in the same state, not an error.
      - name: Attach the .vsix to a GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          tag="kumihimo-vscode@${VERSION}"
          vsix="packages/vscode/kumihimo-vscode-${VERSION}.vsix"
          mv packages/vscode/kumihimo.vsix "$vsix"

          # The section of the changelog for this version, if it has one.
          notes=$(mktemp)
          awk -v v="## ${VERSION}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/vscode/CHANGELOG.md > "$notes"

          {
            echo
            echo '## 入れ方 / Install'
            echo
            echo '```'
            echo "code --install-extension kumihimo-vscode-${VERSION}.vsix"
            echo '```'
            echo
            echo '拡張パネル右上の「…」→ **Install from VSIX…** でも同じです。'
            echo
            echo '同梱物のライセンスは `THIRD-PARTY-NOTICES.txt` にあります。elkjs は EPL-2.0 です。'
          } >> "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" --clobber
            echo "::notice::既存のリリース $tag の .vsix を差し替えました"
          else
            gh release create "$tag" "$vsix" \
              --title "kumihimo for VS Code ${VERSION}" \
              --notes-file "$notes" \
              --latest=false
            echo "::notice::リリース $tag を作成しました"
          fi

      # Nothing long-lived is stored: GitHub mints an OIDC token for this run, Entra ID
      # exchanges it for one that expires in an hour, and `vsce` picks that up through the
      # signed-in Azure CLI. Tried before the PAT, which is a stored secret with a date on
      # it — though PATs are not going away, whatever anyone half-remembers.
      - name: Sign in to Entra ID
        if: steps.version.outputs.publish == 'true' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # Publishing touches no Azure resource, so there may be no subscription to name —
          # and requiring one would mean asking for a billing account to upload a file.
          allow-no-subscriptions: true

      - name: Publish to the Visual Studio Marketplace (Entra ID)
        if: steps.version.outputs.publish == 'true' && env.AZURE_CLIENT_ID != ''
        run: pnpm --filter kumihimo-vscode exec vsce publish --packagePath kumihimo.vsix --azure-credential

      # Skipped rather than failed when nothing is configured, the same way Open VSX is.
      # A pipeline that has not been given credentials has nothing to report as broken.
      - name: Publish to the Visual Studio Marketplace (token)
        if: steps.version.outputs.publish == 'true' && env.AZURE_CLIENT_ID == '' && env.VSCE_PAT != ''
        run: pnpm --filter kumihimo-vscode exec vsce publish --packagePath kumihimo.vsix

      - name: Say where the .vsix is, when nothing was published
        if: steps.version.outputs.publish == 'true' && env.AZURE_CLIENT_ID == '' && env.VSCE_PAT == ''
        run: |
          echo "::notice::Marketplace への公開設定がありません。" \
               "この実行の GitHub リリースから .vsix を取得し、" \
               "https://marketplace.visualstudio.com/manage/publishers/love-rox で手動アップロードしてください。" \
               "自動化するには AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID を variables に設定してください。"

      # VSCodium, Cursor and the rest install from Open VSX rather than the Marketplace.
      # Skipped rather than failed when no token is configured: the Marketplace is the
      # release, and this is the same bytes reaching a second shop. The token is read from
      # the job's env rather than the step's, because a step's own `env:` is not visible to
      # its `if:` — the condition would always see an empty string.
      - name: Publish to Open VSX
        if: steps.version.outputs.publish == 'true' && env.OVSX_PAT != ''
        run: pnpm --filter kumihimo-vscode exec ovsx publish kumihimo.vsix
