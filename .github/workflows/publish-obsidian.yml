name: Publish Obsidian plugin

# Obsidian's directory takes a repository URL and reads the `manifest.json` at the root of
# its default branch. A monorepo cannot answer that, so the plugin is mirrored to a
# repository shaped the way the directory expects — built here, published there.
#
# The trigger is the version in `package.json`, not the one in the manifest. Changesets
# moves the first; the build copies it into the second. Watching the manifest would have
# meant watching a file that only changes after the build this workflow is deciding whether
# to run — and the release would never have fired at all.
on:
  push:
    branches: [main]
    paths:
      - 'packages/obsidian/**'
      - 'packages/core/**'
  workflow_dispatch:

concurrency:
  group: publish-obsidian
  cancel-in-progress: false

permissions:
  contents: read
  # `attest-build-provenance` signs with a short-lived OIDC token and records the result
  # against this repository. The directory asks for these, and it is a fair thing to ask:
  # what somebody installs is a 1.5 MB bundle, and an attestation is how they check it came
  # from the source beside it rather than from somewhere else.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The previous commit, to see whether the version moved.
          fetch-depth: 2

      - id: version
        name: Decide whether this is a release
        run: |
          current=$(node -p "require('./packages/obsidian/package.json').version")
          previous=$(git show HEAD~1:packages/obsidian/package.json 2>/dev/null \
            | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo none)

          echo "current=$current"   >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "手動実行のため公開します ($current)"
          elif [ "$current" != "$previous" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "版が動きました: $previous → $current"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "版は $current のまま。公開しません"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@v5

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.publish == 'true'
        run: pnpm --filter "kumihimo-obsidian..." build

      # Nothing goes out that has not been run. The smoke test loads the built plugin
      # against a stand-in for the app and checks a block really does become a drawing.
      - if: steps.version.outputs.publish == 'true'
        run: pnpm --filter kumihimo-obsidian test

      - if: steps.version.outputs.publish == 'true'
        name: Assemble the plugin repository
        env:
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          # A script rather than shell in here. Three releases failed in a row on the
          # version of this that lived in YAML — a token scope, an absent `packageManager`,
          # and an apostrophe inside a single-quoted `node -e` that ended it mid-word —
          # and none of the three was visible by reading it. As a script it runs in CI on
          # every commit, and the smoke test checks what it produced.
          node packages/obsidian/scripts/assemble.mjs mirror

          # The lockfile, generated from what was just written. Without one the reviewer
          # cannot install, so `obsidian` and the compiler resolve to `any` — and every
          # line touching either is reported as an unsafe call. One missing file produced a
          # hundred and twenty warnings about code that types perfectly well.
          ( cd mirror && pnpm install --ignore-workspace --lockfile-only )
          test -f mirror/pnpm-lock.yaml

          echo "組み立てたもの ($VERSION):"
          find mirror -type f -not -path '*/node_modules/*' | sort

      - if: steps.version.outputs.publish == 'true'
        name: Push to the plugin repository
        env:
          # A token with write access to the mirror. Without it the workflow says so and
          # stops rather than half-publishing.
          TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::OBSIDIAN_REPO_TOKEN が設定されていません。docs/PUBLISHING.md を参照してください"
            exit 1
          fi

          cd mirror
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "kumihimo ${VERSION}

          Built from Love-Rox/kumihimo@${GITHUB_SHA}."

          git remote add origin "https://x-access-token:${TOKEN}@github.com/Love-Rox/obsidian-kumihimo.git"
          # Force, because this is a mirror and not a history: the monorepo is the history.
          git push -q --force origin HEAD:main

      - if: steps.version.outputs.publish == 'true'
        name: Tag it, and let it release itself
        env:
          TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          cd mirror
          # The tag is what the plugin repository's own workflow waits for. It builds from
          # the source just pushed, signs the result, and attaches it — so the provenance
          # is recorded where somebody checking the plugin would look for it, and the
          # attached file is demonstrably what that source produces.
          git tag "$VERSION"
          git push -q origin "refs/tags/$VERSION"

          {
            echo "### Obsidian ${VERSION} を送りました"
            echo ""
            echo "ミラーのワークフローがソースからビルドし、署名してリリースを作ります。"
            echo "https://github.com/Love-Rox/obsidian-kumihimo/actions"
          } >> "$GITHUB_STEP_SUMMARY"
