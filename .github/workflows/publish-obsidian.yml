name: Publish Obsidian plugin

# Obsidian's directory takes a repository URL and reads the `manifest.json` at the root of
# its default branch. A monorepo cannot answer that, so the plugin is mirrored to a
# repository shaped the way the directory expects — built here, published there.
#
# The trigger is the version in `package.json`, not the one in the manifest. Changesets
# moves the first; the build copies it into the second. Watching the manifest would have
# meant watching a file that only changes after the build this workflow is deciding whether
# to run — and the release would never have fired at all.
on:
  push:
    branches: [main]
    paths:
      - 'packages/obsidian/**'
      - 'packages/core/**'
  workflow_dispatch:

concurrency:
  group: publish-obsidian
  cancel-in-progress: false

permissions:
  contents: read
  # `attest-build-provenance` signs with a short-lived OIDC token and records the result
  # against this repository. The directory asks for these, and it is a fair thing to ask:
  # what somebody installs is a 1.5 MB bundle, and an attestation is how they check it came
  # from the source beside it rather than from somewhere else.
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # The previous commit, to see whether the version moved.
          fetch-depth: 2

      - id: version
        name: Decide whether this is a release
        run: |
          current=$(node -p "require('./packages/obsidian/package.json').version")
          previous=$(git show HEAD~1:packages/obsidian/package.json 2>/dev/null \
            | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo none)

          echo "current=$current"   >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "手動実行のため公開します ($current)"
          elif [ "$current" != "$previous" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "版が動きました: $previous → $current"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "版は $current のまま。公開しません"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@v5

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.publish == 'true'
        run: pnpm --filter "kumihimo-obsidian..." build

      # Nothing goes out that has not been run. The smoke test loads the built plugin
      # against a stand-in for the app and checks a block really does become a drawing.
      - if: steps.version.outputs.publish == 'true'
        run: pnpm --filter kumihimo-obsidian test

      - if: steps.version.outputs.publish == 'true'
        name: Assemble the plugin repository
        env:
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          rm -rf mirror && mkdir -p mirror/src mirror/scripts

          # The built plugin, and what the directory reads, at the root where it reads it.
          cp packages/obsidian/dist/main.js       mirror/main.js
          cp packages/obsidian/manifest.json      mirror/manifest.json
          cp packages/obsidian/styles.css         mirror/styles.css
          cp packages/obsidian/README.md          mirror/README.md
          cp packages/obsidian/LICENSE            mirror/LICENSE

          # And the source it was built from. The directory refuses a repository that has
          # only the bundle in it — closed source is not accepted — and it is right to: a
          # 1.5 MB minified file is not something anybody can read before trusting it.
          cp packages/obsidian/src/*.ts           mirror/src/
          cp packages/obsidian/scripts/*.mjs      mirror/scripts/
          cp packages/obsidian/tsconfig.json      mirror/tsconfig.json

          # The mirror builds and signs its own release. `attest-build-provenance` records
          # against the repository that runs it, so attesting from here would have put the
          # provenance on the monorepo — where nobody checking the plugin would look for it.
          mkdir -p mirror/.github/workflows
          cp .github/workflows/mirror-release.yml mirror/.github/workflows/release.yml

          # A package.json that works here rather than only inside the monorepo: the
          # compiler comes from npm at the version this build actually used, so somebody
          # can clone this, install, build, and get the file that is attached to the
          # release.
          CORE=$(node -p "require('./packages/core/package.json').version")
          node -e '
            const fs = require("node:fs");
            const src = JSON.parse(fs.readFileSync("packages/obsidian/package.json", "utf8"));
            const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
            fs.writeFileSync("mirror/package.json", JSON.stringify({
              name: "obsidian-kumihimo",
              version: src.version,
              description: src.description,
              license: "MIT",
              private: true,
              // Which pnpm, because `pnpm/action-setup` refuses to guess and there is no
              // monorepo root here to read it from. Without it the mirror's own workflow
              // cannot even install.
              packageManager: root.packageManager,
              scripts: { build: src.scripts.build, test: src.scripts.test, typecheck: src.scripts.typecheck },
              // Exact, not a range. A caret means somebody building this next year gets
              // a different compiler than the one the release was built with, and then the
              // bundle they produce is not the bundle that was attested.
              dependencies: { "@love-rox/kumihimo-core": process.env.CORE },
              // TypeScript comes from the monorepo root here, so it has to be named
              // explicitly there — a repository that says it can be built has to be
              // buildable, `typecheck` included.
              // TypeScript and the Node types come from the monorepo root here, so they
              // have to be named explicitly there — a repository that says it can be
              // built has to be buildable, `typecheck` included.
              devDependencies: {
                ...src.devDependencies,
                typescript: root.devDependencies.typescript,
                "@types/node": root.devDependencies["@types/node"],
              },
            }, null, 2) + "\n");
          '

          # The package's tsconfig extends `../../tsconfig.base.json`, a path that means
          # nothing once the package is the whole repository. Rewrite the one line rather
          # than ship a file that cannot resolve — checked by building the assembled folder
          # on its own, which is the only way to know.
          cp tsconfig.base.json mirror/tsconfig.base.json
          node -e '
            const fs = require("node:fs");
            const path = "mirror/tsconfig.json";
            const text = fs.readFileSync(path, "utf8").replace("../../tsconfig.base.json", "./tsconfig.base.json");
            fs.writeFileSync(path, text);
          '

          cat > mirror/.gitignore <<'EOF'
          node_modules/
          dist/
          EOF

          # A lockfile, generated by installing what was just written. Without one the
          # reviewer cannot install, so `obsidian` and the compiler resolve to `any` — and
          # every line that touches either is reported as an unsafe call. One missing file
          # produced a hundred and twenty warnings about code that types perfectly well.
          ( cd mirror && pnpm install --ignore-workspace --lockfile-only )
          test -f mirror/pnpm-lock.yaml || { echo '::error::lockfile が作られませんでした'; exit 1; }

          # Where it came from, so nobody edits the copy and wonders why it reverts.
          cat > mirror/CONTRIBUTING.md <<'EOF'
          # Contributing

          This repository is generated, and everything in it is built from
          [Love-Rox/kumihimo](https://github.com/Love-Rox/kumihimo) under `packages/obsidian`
          — where the plugin lives beside the compiler it uses. It is mirrored here because
          Obsidian's community directory reads `manifest.json` from the root of a repository,
          which a monorepo cannot offer.

          The source is here and it builds:

          ```sh
          pnpm install
          pnpm build
          ```

          That produces the `main.js` attached to the matching release, from the compiler
          version pinned in `package.json`.

          Open issues and pull requests against the monorepo. Changes made here are
          overwritten by the next release.
          EOF

          # The build syncs the manifest from package.json; if that ever stops happening,
          # Obsidian would look for a release tag that does not exist and the plugin would
          # simply fail to install.
          shipped=$(node -p "require('./mirror/manifest.json').version")
          if [ "$shipped" != "$VERSION" ]; then
            echo "::error::manifest.json は $shipped、package.json は $VERSION。同期されていません"
            exit 1
          fi

          echo "組み立てたもの ($VERSION):"
          ls -la mirror

      - if: steps.version.outputs.publish == 'true'
        name: Push to the plugin repository
        env:
          # A token with write access to the mirror. Without it the workflow says so and
          # stops rather than half-publishing.
          TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::OBSIDIAN_REPO_TOKEN が設定されていません。docs/PUBLISHING.md を参照してください"
            exit 1
          fi

          cd mirror
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "kumihimo ${VERSION}

          Built from Love-Rox/kumihimo@${GITHUB_SHA}."

          git remote add origin "https://x-access-token:${TOKEN}@github.com/Love-Rox/obsidian-kumihimo.git"
          # Force, because this is a mirror and not a history: the monorepo is the history.
          git push -q --force origin HEAD:main

      - if: steps.version.outputs.publish == 'true'
        name: Tag it, and let it release itself
        env:
          TOKEN: ${{ secrets.OBSIDIAN_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          cd mirror
          # The tag is what the plugin repository's own workflow waits for. It builds from
          # the source just pushed, signs the result, and attaches it — so the provenance
          # is recorded where somebody checking the plugin would look for it, and the
          # attached file is demonstrably what that source produces.
          git tag "$VERSION"
          git push -q origin "refs/tags/$VERSION"

          {
            echo "### Obsidian ${VERSION} を送りました"
            echo ""
            echo "ミラーのワークフローがソースからビルドし、署名してリリースを作ります。"
            echo "https://github.com/Love-Rox/obsidian-kumihimo/actions"
          } >> "$GITHUB_STEP_SUMMARY"
